; PlatformIO Project Configuration File — Main Controller (ESP32 DevKit V1)
; Build: pio run
; Wokwi: Uses .pio/build/esp32dev/firmware.bin and firmware.elf

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
